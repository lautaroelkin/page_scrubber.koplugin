name: Build release zip

# Se ejecuta solo al publicar un release.
# También se puede lanzar a mano desde la pestaña Actions (para releases ya publicados).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release al que se le adjunta el zip (ej: v7.7.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the tagged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build zip
        run: |
          PLUGIN_DIR="page_scrubber.koplugin"
          mkdir -p "/tmp/build/$PLUGIN_DIR"

          # Copia todo tal cual, salvo lo que solo sirve para GitHub:
          #   - la carpeta images/ (de la raíz del repo)
          #   - README.md (de la raíz del repo)
          #   - .git, .github y .gitignore (no son parte del plugin)
          rsync -a \
            --exclude='/images/' \
            --exclude='/README.md' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            ./ "/tmp/build/$PLUGIN_DIR/"

          # El zip trae adentro la carpeta con el nombre correcto
          # (page_scrubber.koplugin), así que se descomprime y se copia sin renombrar.
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/page_scrubber.koplugin-${TAG}.zip" "$PLUGIN_DIR"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "page_scrubber.koplugin-${TAG}.zip" --clobber
