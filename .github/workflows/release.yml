name: Build release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v7.7.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build zip
        run: |
          PLUGIN_DIR="page_scrubber.koplugin"
          mkdir -p "/tmp/build/$PLUGIN_DIR"
          rsync -a \
            --exclude='/images/' \
            --exclude='/README.md' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            ./ "/tmp/build/$PLUGIN_DIR/"
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/page_scrubber.koplugin-${TAG}.zip" "$PLUGIN_DIR"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "page_scrubber.koplugin-${TAG}.zip" --clobber

      - name: Add installation instructions to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q "^## Installation" notes.md; then
            cat >> notes.md <<'NOTES'

          ## Installation
          1. Download the zip named `page_scrubber.koplugin-<version>.zip` from the **Assets** section below (not "Source code").
          2. Unzip it and copy the `page_scrubber.koplugin` folder into `koreader/plugins/`.
          3. Restart KOReader.

          To update, replace the folder. To uninstall, delete it (and `koreader/patches/2--page-scrubber-font.lua` if you used the system font).
          NOTES
            gh release edit "$TAG" --notes-file notes.md
          fi
